<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CogniFlow - Reset Password</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
    .container { background: white; border: 1px solid #d1d1d1; max-width: 600px; margin: 40px auto; padding: 40px; }
    .logo { border-bottom: 2px solid #003d7a; padding-bottom: 20px; margin-bottom: 30px; }
    .logo h1 { color: #003d7a; font-size: 1.75rem; font-weight: 600; margin-bottom: 5px; }
    .logo p { color: #555; font-size: 0.9rem; }
    .welcome-text { margin-bottom: 24px; }
    .welcome-text h2 { color: #333; font-size: 1.1rem; margin-bottom: 10px; font-weight: 600; }
    .welcome-text p { color: #666; font-size: 0.9rem; line-height: 1.6; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #333; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    input[type="email"] { width: 100%; padding: 8px 12px; border: 1px solid #ccc; border-radius: 3px; font-size: 0.95rem; background: white; font-family: Arial, Helvetica, sans-serif; }
    input[type="email"]:focus { outline: none; border-color: #003d7a; }
    .btn { width: 100%; padding: 12px; background: #003d7a; color: white; border: none; border-radius: 3px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: Arial, Helvetica, sans-serif; }
    .btn:hover { background: #002d5a; }
    .back-link { margin-top: 16px; text-align: center; font-size: 0.88rem; color: #666; }
    .back-link a { color: #003d7a; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>CogniFlow</h1>
      <p>Philadelphia Pointing Span Test</p>
    </div>
    <div class="welcome-text">
      <h2>Reset your password</h2>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_email">Email address</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn">Send reset link</button>
    </form>
    <div class="back-link">
      <a href="/login/">Back to sign in</a>
    </div>
  </div>
</body>
</html>
