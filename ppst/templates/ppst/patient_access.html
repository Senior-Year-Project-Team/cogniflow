<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CogniFlow - Patient Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border: 1px solid #d1d1d1;
            max-width: 600px;
            margin: 40px auto;
            padding: 40px;
        }

        .logo {
            border-bottom: 2px solid #003d7a;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #003d7a;
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .logo p {
            color: #555;
            font-size: 0.9rem;
        }

        .welcome-text {
            margin-bottom: 30px;
        }

        .welcome-text h2 {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .welcome-text p {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 0.95rem;
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #003d7a;
        }

        .voice-options {
            display: flex;
            gap: 15px;
        }

        .voice-option {
            flex: 1;
        }

        .voice-option input[type="radio"] {
            margin-right: 8px;
            vertical-align: middle;
        }

        .voice-option label {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 1px solid #ccc;
            background: #fafafa;
            cursor: pointer;
            margin-bottom: 0;
            font-weight: normal;
        }

        .voice-option input[type="radio"]:checked + label {
            background: #e6f2ff;
            border-color: #003d7a;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .voice-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .voice-option {
            flex: 1;
            min-width: 80px;
        }

        .voice-option input[type="radio"] {
            display: none;
        }

        .voice-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 1px solid #ccc;
            background: #fafafa;
            cursor: pointer;
            font-weight: normal;
            border-radius: 3px;
            font-size: 0.9rem;
        }

        .voice-option input[type="radio"]:checked + label {
            background: #e6f2ff;
            border-color: #003d7a;
            color: #003d7a;
            font-weight: 600;
        }

        .start-button {
            width: 100%;
            padding: 12px;
            background: #003d7a;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .start-button:hover {
            background: #002d5a;
        }

        .start-button:active {
            background: #001d3a;
        }

        .privacy-note {
            margin-top: 30px;
            padding: 15px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-left: 4px solid #003d7a;
        }

        .privacy-note p {
            color: #555;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .privacy-note strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 20px auto;
            }

            .logo h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .voice-options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo and Branding -->
        <div class="logo">
            <h1>CogniFlow</h1>
            <p>Philadelphia Pointing Span Test</p>
        </div>

        <!-- Welcome Message -->
        <div class="welcome-text">
            <h2 id="welcome-title">Welcome to Your Assessment</h2>
            <p id="welcome-description">Please configure your preferences before beginning the test.</p>
        </div>

        <!-- Begin Form — no patient input required, clinician already set everything -->
        <form id="patient-config-form" action="" method="POST">
             {% csrf_token %}

            <div class="form-group">
                <label id="label-voice">Audio Voice</label>
                <div class="voice-options">
                    <div class="voice-option">
                        <input type="radio" id="voice-male" name="voice_override" value="male"
                            {% if voice == 'male' %}checked{% endif %}>
                        <label for="voice-male" id="label-voice-male">Male</label>
                </div>
                <div class="voice-option">
                    <input type="radio" id="voice-female" name="voice_override" value="female"
                        {% if voice == 'female' %}checked{% endif %}>
                    <label for="voice-female" id="label-voice-female">Female</label>
                </div>
                <div class="voice-option">
                    <input type="radio" id="voice-none" name="voice_override" value="none"
                        {% if voice == 'none' %}checked{% endif %}>
                    <label for="voice-none" id="label-voice-none">No Voice</label>
                </div>
            </div>
        </div>

        <button type="submit" class="start-button" id="start-button">Begin Assessment</button>
    </form>

        <!-- Privacy Notice -->
        <div class="privacy-note">
            <p><strong id="privacy-title">Privacy Notice</strong></p>
            <p id="privacy-text">Your privacy is protected. This assessment is completely anonymous and collects no personally identifiable information.</p>
        </div>
    </div>

    <script>
        const lang = "{{ language|default:'en' }}";

        const translations = {
            en: {
                welcomeTitle:       "Welcome to Your Assessment",
                welcomeDescription: "Your clinician has prepared this session for you. Press Begin when you are ready.",
                startButton:        "Begin Assessment",
                privacyTitle:       "Privacy Notice",
                privacyText:        "Your privacy is protected. This assessment is completely anonymous and collects no personally identifiable information.",
            },
            es: {
                welcomeTitle:       "Bienvenido a Su Evaluación",
                welcomeDescription: "Su médico ha preparado esta sesión para usted. Presione Comenzar cuando esté listo.",
                startButton:        "Comenzar Evaluación",
                privacyTitle:       "Aviso de Privacidad",
                privacyText:        "Su privacidad está protegida. Esta evaluación es completamente anónima y no recopila información de identificación personal.",
            }
        };

        const t = translations[lang] || translations.en;

        document.getElementById('welcome-title').textContent       = t.welcomeTitle;
        document.getElementById('welcome-description').textContent = t.welcomeDescription;
        document.getElementById('start-button').textContent        = t.startButton;
        document.getElementById('privacy-title').textContent       = t.privacyTitle;
        document.getElementById('privacy-text').textContent        = t.privacyText;
    </script>
</body>
</html>
