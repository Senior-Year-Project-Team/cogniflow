<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniFlow - Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .test-container {
            background: white;
            border: 1px solid #d1d1d1;
            max-width: 800px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: #003d7a;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .trial-info {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .trial-info strong {
            color: #003d7a;
        }

        .status-message {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 30px;
            min-height: 30px;
        }

        .stimulus-display {
            background: #f9f9f9;
            border: 2px solid #003d7a;
            padding: 60px 40px;
            margin: 30px 0;
            border-radius: 3px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stimulus-sequence {
            font-size: 4rem;
            font-weight: 600;
            color: #003d7a;
            display: none;
        }

        .stimulus-sequence.active {
            display: block;
        }

        .response-grid {
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .response-grid.active {
            display: grid;
        }

        .response-button {
            padding: 25px;
            font-size: 1.5rem;
            font-weight: 600;
            background: white;
            border: 2px solid #003d7a;
            color: #003d7a;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
            font-family: Arial, Helvetica, sans-serif;
        }

        .response-button:hover {
            background: #e6f2ff;
        }

        .response-button:active {
            transform: scale(0.95);
        }

        /* TEMPORARY click color */
        .response-button.flash {
            background: #7e9fbe;
            color: #ffffff;
        }

        /* Keep this class if you ever want persistent selected state later */
        .response-button.selected {
            background: #003d7a;
            color: white;
        }

        /* Disabled should look normal (not faded blue) */
        .response-button:disabled {
            opacity: 1;
            cursor: not-allowed;
        }

        .user-response {
            font-size: 1.2rem;
            color: #333;
            margin: 20px 0;
            min-height: 40px;
        }

        .user-response strong {
            color: #003d7a;
        }

        .action-button {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            background: #003d7a;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-family: Arial, Helvetica, sans-serif;
            margin: 10px 5px;
            display: none;
        }

        .action-button.active {
            display: inline-block;
        }

        .action-button:hover {
            background: #002d5a;
        }

        .completion-screen {
            display: none;
            padding: 40px 20px;
        }

        .completion-screen.active {
            display: block;
        }

        .completion-screen h2 {
            color: #003d7a;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .completion-screen p {
            color: #555;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .completion-icon {
            font-size: 4rem;
            color: #28a745;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .test-container {
                padding: 30px 20px;
            }

            .stimulus-sequence {
                font-size: 3rem;
            }

            .response-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .response-button {
                padding: 20px;
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .response-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stimulus-sequence {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div id="test-interface">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>

            <div class="trial-info">
                <span id="trial-counter">Trial <strong id="current-trial">1</strong> of <strong id="total-trials">12</strong></span>
            </div>

            <div class="status-message" id="status-message">
                <span id="status-text">Get ready...</span>
            </div>

            <div class="stimulus-display">
                <div class="stimulus-sequence" id="stimulus"></div>
            </div>

            <div class="user-response" id="user-response"></div>

            <div class="response-grid" id="response-grid"></div>

            <button class="action-button" id="submit-btn">Submit Response</button>
            <button class="action-button" id="next-btn">Next Trial</button>
        </div>

        <div class="completion-screen" id="completion-screen">
            <div class="completion-icon">✓</div>
            <h2 id="completion-title">Assessment Complete</h2>
            <p id="completion-message">Thank you for completing the Philadelphia Pointing Span Test.</p>
            <p id="completion-info">Your responses have been recorded. You may now close this window.</p>
        </div>
    </div>

    <script>
        const language = "{{ language|default:'en' }}";

        // PPST spec: 6 digit trials (3 x 4-span, 3 x 5-span)
        //            6 mixed trials (3 x 4-span, 3 x 5-span)
        const testTrials = [
            // Digit-only -- 3 x 4-span
            { sequence: ['3', '9', '1', '7'],        type: 'digit' },
            { sequence: ['6', '2', '8', '4'],        type: 'digit' },
            { sequence: ['5', '1', '9', '3'],        type: 'digit' },
            // Digit-only -- 3 x 5-span
            { sequence: ['7', '2', '5', '9', '1'],   type: 'digit' },
            { sequence: ['4', '8', '1', '6', '3'],   type: 'digit' },
            { sequence: ['9', '3', '6', '2', '8'],   type: 'digit' },
            // Mixed -- 3 x 4-span (2 digits + 2 letters each)
            { sequence: ['5', 'R', '2', 'B'],        type: 'mixed' },
            { sequence: ['T', '7', 'D', '4'],        type: 'mixed' },
            { sequence: ['8', 'N', '1', 'K'],        type: 'mixed' },
            // Mixed -- 3 x 5-span (3 digits + 2 letters each)
            { sequence: ['T', '7', 'D', '4', 'N'],   type: 'mixed' },
            { sequence: ['9', 'L', '3', 'F', '6'],   type: 'mixed' },
            { sequence: ['M', '2', 'S', '8', 'C'],   type: 'mixed' },
        ];

        const digitSymbols = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
        const letterSymbols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'K', 'L', 'M', 'N', 'R', 'S', 'T'];

        let currentTrialIndex = 0;
        let userResponse = [];
        let startTime = null;
        let testResults = [];

        const translations = {
            en: {
                trialCounter: "Trial",
                of: "of",
                getReady: "Get ready...",
                watchAndListen: "Watch and listen carefully...",
                nowRespond: "Now click the symbols in order:",
                yourResponse: "Your response:",
                submit: "Submit Response",
                nextTrial: "Next Trial",
                completionTitle: "Assessment Complete",
                completionMessage: "Thank you for completing the Philadelphia Pointing Span Test.",
                completionInfo: "Your responses have been recorded. You may now close this window."
            },
            es: {
                trialCounter: "Prueba",
                of: "de",
                getReady: "Prepárese...",
                watchAndListen: "Observe y escuche con atención...",
                nowRespond: "Ahora haga clic en los símbolos en orden:",
                yourResponse: "Su respuesta:",
                submit: "Enviar Respuesta",
                nextTrial: "Siguiente Prueba",
                completionTitle: "Evaluación Completa",
                completionMessage: "Gracias por completar la Prueba de Amplitud de Señalamiento de Filadelfia.",
                completionInfo: "Sus respuestas han sido registradas. Ahora puede cerrar esta ventana."
            }
        };

        const t = translations[language] || translations.en;

        document.getElementById('trial-counter').innerHTML =
            `${t.trialCounter} <strong id="current-trial">1</strong> ${t.of} <strong id="total-trials">12</strong>`;
        document.getElementById('submit-btn').textContent = t.submit;
        document.getElementById('next-btn').textContent = t.nextTrial;
        document.getElementById('completion-title').textContent = t.completionTitle;
        document.getElementById('completion-message').textContent = t.completionMessage;
        document.getElementById('completion-info').textContent = t.completionInfo;

        function initTest() {
            setTimeout(() => {
                startTrial();
            }, 1500);
        }

        function startTrial() {
            const trial = testTrials[currentTrialIndex];
            userResponse = [];

            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }

            const progress = ((currentTrialIndex + 1) / testTrials.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
            document.getElementById('current-trial').textContent = currentTrialIndex + 1;

            document.getElementById('status-text').textContent = t.watchAndListen;
            document.getElementById('stimulus').classList.remove('active');
            document.getElementById('response-grid').classList.remove('active');
            document.getElementById('user-response').textContent = '';
            hideAllButtons();

            setTimeout(() => {
                showStimulus(trial.sequence);
            }, 1000);
        }

        function showStimulus(sequence) {
            let currentIndex = 0;
            const stimulusEl = document.getElementById('stimulus');

            function showNextSymbol() {
                if (currentIndex < sequence.length) {
                    const symbol = sequence[currentIndex];

                    stimulusEl.textContent = symbol;
                    stimulusEl.classList.add('active');

                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(symbol);
                        utterance.lang = language === 'es' ? 'es-ES' : 'en-US';
                        utterance.rate = 0.8;
                        speechSynthesis.speak(utterance);
                    }

                    currentIndex++;

                    setTimeout(() => {
                        stimulusEl.classList.remove('active');
                        setTimeout(showNextSymbol, 200);
                    }, 1000);
                } else {
                    setTimeout(() => {
                        showResponseGrid(testTrials[currentTrialIndex].type);
                    }, 500);
                }
            }

            showNextSymbol();
        }

        function showResponseGrid(type) {
            document.getElementById('status-text').textContent = t.nowRespond;

            let symbols;
            if (type === 'digit') {
                symbols = digitSymbols;
            } else {
                symbols = [...digitSymbols, ...letterSymbols].sort();
            }

            const grid = document.getElementById('response-grid');
            grid.innerHTML = '';

            symbols.forEach(symbol => {
                const button = document.createElement('button');
                button.className = 'response-button';
                button.textContent = symbol;
                button.onclick = () => selectSymbol(symbol, button);
                grid.appendChild(button);
            });

            grid.classList.add('active');
            document.getElementById('submit-btn').classList.add('active');
            startTime = Date.now();
        }

        // FLASH ONLY, THEN RETURN TO ORIGINAL LOOK
        function selectSymbol(symbol, button) {
            if (button.disabled || button.classList.contains('flash')) return;

            userResponse.push(symbol);

            button.classList.add('flash');

            setTimeout(() => {
                button.classList.remove('flash');
                button.disabled = true; // disabled but stays original color because opacity is 1
            }, 220);

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(symbol);
                utterance.lang = language === 'es' ? 'es-ES' : 'en-US';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }

            document.getElementById('user-response').innerHTML =
                `<strong>${t.yourResponse}</strong> ${userResponse.join(' - ')}`;
        }

        // Returns the PPST-correct expected answer for a trial.
        // Digit: digits sorted numerically. Mixed: digits ascending, then letters alphabetically.
        // Server always recomputes authoritatively -- this is for client-side feedback only.
        function computeCorrectResponse(sequence, type) {
            if (type === 'digit') {
                return [...sequence].sort((a, b) => parseInt(a) - parseInt(b));
            }
            const digits  = sequence.filter(s => /^\d$/.test(s)).sort((a, b) => parseInt(a) - parseInt(b));
            const letters = sequence.filter(s => /^[A-Za-z]$/.test(s)).sort();
            return [...digits, ...letters];
        }

        document.getElementById('submit-btn').onclick = function () {
            if (userResponse.length === 0) return;

            const responseTime = Date.now() - startTime;
            const trial = testTrials[currentTrialIndex];

            // Compare against PPST-reordered correct answer, not raw stimulus order
            const correctAnswer = computeCorrectResponse(trial.sequence, trial.type);
            const isCorrect = JSON.stringify(userResponse) === JSON.stringify(correctAnswer);

            testResults.push({
                trialNumber: currentTrialIndex + 1,
                type: trial.type,
                stimulus: trial.sequence,
                response: userResponse,
                correct: isCorrect,
                responseTime: responseTime
            });

            const buttons = document.querySelectorAll('.response-button');
            buttons.forEach(btn => btn.disabled = true);

            this.classList.remove('active');

            if (currentTrialIndex < testTrials.length - 1) {
                document.getElementById('next-btn').classList.add('active');
            } else {
                finishTest();
            }
        };

        document.getElementById('next-btn').onclick = function () {
            currentTrialIndex++;
            this.classList.remove('active');
            startTrial();
        };

        function finishTest() {
            document.getElementById('test-interface').style.display = 'none';
            document.getElementById('completion-screen').classList.add('active');
            sendResults();
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function sendResults() {
            fetch('/test/submit/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ results: testResults }),
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    console.error('Submission error:', data.error);
                }
            })
            .catch(err => {
                console.error('Network error during result submission:', err);
            });
        }

        function hideAllButtons() {
            document.getElementById('submit-btn').classList.remove('active');
            document.getElementById('next-btn').classList.remove('active');
        }

        initTest();
    </script>
</body>
</html>
