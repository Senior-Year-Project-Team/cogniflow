<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CogniFlow - Password Reset Complete</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
    .container { background: white; border: 1px solid #d1d1d1; max-width: 600px; margin: 40px auto; padding: 40px; text-align: center; }
    .logo { border-bottom: 2px solid #003d7a; padding-bottom: 20px; margin-bottom: 30px; text-align: left; }
    .logo h1 { color: #003d7a; font-size: 1.75rem; font-weight: 600; margin-bottom: 5px; }
    .logo p { color: #555; font-size: 0.9rem; }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h2 { color: #333; font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
    p { color: #666; font-size: 0.92rem; line-height: 1.6; margin-bottom: 20px; }
    .btn { display: inline-block; padding: 12px 32px; background: #003d7a; color: white; text-decoration: none; border-radius: 3px; font-size: 1rem; font-weight: 600; font-family: Arial, Helvetica, sans-serif; }
    .btn:hover { background: #002d5a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>CogniFlow</h1>
      <p>Philadelphia Pointing Span Test</p>
    </div>
    <div class="icon">✓</div>
    <h2>Password reset complete</h2>
    <p>Your password has been set. You can now sign in with your new password.</p>
    <a href="/login/" class="btn">Sign in</a>
  </div>
</body>
</html>
