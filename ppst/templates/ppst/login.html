<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniFlow - Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        background: white;
        border: 1px solid #d1d1d1;
        max-width: 600px;
        margin: 40px auto;
        padding: 40px;
      }

      .logo {
        border-bottom: 2px solid #003d7a;
        padding-bottom: 20px;
        margin-bottom: 30px;
      }

      .logo h1 {
        color: #003d7a;
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .logo p {
        color: #555;
        font-size: 0.9rem;
      }

      .welcome-text {
        margin-bottom: 24px;
      }

      .welcome-text h2 {
        color: #333;
        font-size: 1.1rem;
        margin-bottom: 10px;
        font-weight: 600;
      }

      .welcome-text p {
        color: #666;
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #333;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 0.95rem;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-size: 0.95rem;
        background: white;
        font-family: Arial, Helvetica, sans-serif;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: #003d7a;
      }

      .helper-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 10px;
      }

      .helper-row a {
        color: #003d7a;
        text-decoration: none;
        font-weight: 600;
      }

      .login-button {
        width: 100%;
        padding: 12px;
        background: #003d7a;
        color: white;
        border: none;
        border-radius: 3px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 6px;
        font-family: Arial, Helvetica, sans-serif;
      }

      .login-button:hover {
        background: #002d5a;
      }

      .login-button:active {
        background: #001d3a;
      }

      .privacy-note {
        margin-top: 28px;
        padding: 15px;
        background: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-left: 4px solid #003d7a;
      }

      .privacy-note p {
        color: #555;
        font-size: 0.85rem;
        line-height: 1.5;
      }

      .privacy-note strong {
        color: #333;
        display: block;
        margin-bottom: 5px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 30px 20px;
          margin: 20px auto;
        }

        .logo h1 {
          font-size: 1.5rem;
        }

        .helper-row {
          flex-direction: column;
          align-items: flex-start;
        }
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <h1>CogniFlow</h1>
        <p>Philadelphia Pointing Span Test</p>
      </div>

      <div class="welcome-text">
        <h2>Sign in to continue</h2>
        <p>Use your clinician or research account to access secure PPST sessions.</p>
      </div>

      <form action="/clinician/dashboard/" method="get">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@clinic.org" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <div class="helper-row">
          <label style="display: flex; gap: 8px; align-items: center">
            <input type="checkbox" />
            Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-button">Sign in</button>
      </form>

      <div class="privacy-note">
        <p><strong>Security Notice</strong></p>
        <p>Access is restricted to authorized staff. All sessions are logged and encrypted.</p>
      </div>
    </div>
  </body>
</html>
