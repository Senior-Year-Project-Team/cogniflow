<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CogniFlow - Check Your Email</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; min-height: 100vh; padding: 20px; }
    .container { background: white; border: 1px solid #d1d1d1; max-width: 600px; margin: 40px auto; padding: 40px; text-align: center; }
    .logo { border-bottom: 2px solid #003d7a; padding-bottom: 20px; margin-bottom: 30px; text-align: left; }
    .logo h1 { color: #003d7a; font-size: 1.75rem; font-weight: 600; margin-bottom: 5px; }
    .logo p { color: #555; font-size: 0.9rem; }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h2 { color: #333; font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; }
    p { color: #666; font-size: 0.92rem; line-height: 1.6; margin-bottom: 12px; }
    .back-link { margin-top: 24px; }
    .back-link a { color: #003d7a; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>CogniFlow</h1>
      <p>Philadelphia Pointing Span Test</p>
    </div>
    <div class="icon">✉️</div>
    <h2>Check your email</h2>
    <p>If an account exists for that address, we've sent a password reset link. Check your inbox and follow the instructions.</p>
    <p>The link will expire in 5 minutes.</p>
    <div class="back-link">
      <a href="/login/">Back to sign in</a>
    </div>
  </div>
</body>
</html>
